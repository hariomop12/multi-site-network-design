name: lab

# The suite talks to a deployed containerlab topology, so CI deploys the lab,
# waits for convergence, then runs the same commands a human would run locally.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: deploy + baseline + fault scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          # No requirements.txt / pyproject.toml here: the lab needs nothing
          # from pip at runtime, the tests only need the dev tooling.
          cache-dependency-path: requirements-dev.txt

      - name: Install python tooling
        run: pip install -r requirements-dev.txt

      - name: Install containerlab
        run: make install-clab SUDO=sudo

      - name: Build node images
        run: make images

      - name: Deploy the topology
        run: make deploy SUDO=sudo

      - name: Wait for OSPF to converge
        run: make wait

      - name: Show the topology
        run: make inspect SUDO=sudo

      - name: Baseline health check
        run: make baseline

      - name: Baseline + fault scenario tests
        run: make test

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          mkdir -p artifacts/logs
          for c in $(docker ps -a --format '{{.Names}}' | grep '^clab-'); do
            docker logs "$c" > "artifacts/logs/$c.log" 2>&1 || true
          done
          # The state the failing assertions actually look at, so a failure can
          # be read straight from the artifact instead of guessed at.
          for sw in hq-sw1 hq-sw2; do
            docker exec "clab-corpnet-$sw" bridge link show \
              > "artifacts/logs/$sw-bridge.txt" 2>&1 || true
          done
          for r in hq-core b1-core b2-core; do
            docker exec "clab-corpnet-$r" vtysh -c 'show ip ospf neighbor' \
              > "artifacts/logs/$r-ospf-neighbours.txt" 2>&1 || true
            docker exec "clab-corpnet-$r" vtysh -c 'show ip route' \
              > "artifacts/logs/$r-routes.txt" 2>&1 || true
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fault-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear the lab down
        if: always()
        run: make destroy SUDO=sudo || true
