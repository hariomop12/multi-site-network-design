frr version 10.7.1
frr defaults traditional
hostname b2-core
!
! ============================================================================
!  Branch-2 site router (ABR for area 3)
!
!   eth1      WAN -> hq-core    10.0.1.2/30    (area 0)
!   eth2      WAN -> b1-core    10.0.2.2/30    (area 0)
!   eth3      trunk -> b2-sw1   none
!   eth3.10   B2 VLAN 10        10.30.10.1/24  (area 3, stub)
! ============================================================================
!
interface lo
 ip address 3.3.3.3/32
!
interface eth1
 description WAN -> hq-core
 ip address 10.0.1.2/30
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 3
 ip ospf dead-interval 10
!
interface eth2
 description WAN -> b1-core
 ip address 10.0.2.2/30
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 3
 ip ospf dead-interval 10
!
interface eth3
 description trunk -> b2-sw1
!
interface eth3.10
 description B2 VLAN 10 - USERS
 ip address 10.30.10.1/24
 ip ospf cost 100
!
router ospf
 ospf router-id 3.3.3.3
 log-adjacency-changes detail
 passive-interface default
 no passive-interface eth1
 no passive-interface eth2
 network 3.3.3.3/32 area 0
 network 10.0.1.0/30 area 0
 network 10.0.2.0/30 area 0
 network 10.30.10.0/24 area 3
 area 3 stub
!
line vty
!
