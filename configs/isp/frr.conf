frr version 10.7.1
frr defaults traditional
hostname isp
!
! ============================================================================
!  Simulated internet provider edge.
!
!  No routing protocol is run towards the customer - a real provider would not
!  peer OSPF with a single corporate site, which is why hq-core needs a static
!  default route.
!
!   eth1   customer edge       203.0.113.1/29
!   eth2   public server LAN   198.51.100.1/24
! ============================================================================
!
interface lo
 ip address 4.4.4.4/32
!
interface eth1
 description customer edge -> hq-core
 ip address 203.0.113.1/29
!
interface eth2
 description public hosting segment -> pub-srv
 ip address 198.51.100.1/24
!
line vty
!
