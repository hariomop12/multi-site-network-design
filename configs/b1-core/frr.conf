frr version 10.7.1
frr defaults traditional
hostname b1-core
!
! ============================================================================
!  Branch-1 site router (ABR for area 2)
!
!   eth1      WAN -> hq-core    10.0.0.2/30    (area 0)
!   eth2      WAN -> b2-core    10.0.2.1/30    (area 0)
!   eth3      trunk -> b1-sw1   none
!   eth3.10   B1 VLAN 10        10.20.10.1/24  (area 2, stub)
! ============================================================================
!
interface lo
 ip address 2.2.2.2/32
!
interface eth1
 description WAN -> hq-core
 ip address 10.0.0.2/30
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 3
 ip ospf dead-interval 10
!
interface eth2
 description WAN -> b2-core
 ip address 10.0.2.1/30
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 3
 ip ospf dead-interval 10
!
interface eth3
 description trunk -> b1-sw1
!
interface eth3.10
 description B1 VLAN 10 - USERS
 ip address 10.20.10.1/24
 ip ospf cost 100
!
router ospf
 ospf router-id 2.2.2.2
 log-adjacency-changes detail
 passive-interface default
 no passive-interface eth1
 no passive-interface eth2
 network 2.2.2.2/32 area 0
 network 10.0.0.0/30 area 0
 network 10.0.2.0/30 area 0
 network 10.20.10.0/24 area 2
 ! As ABR for a stub area, b1-core injects the default route it learned
 ! from hq-core into area 2 automatically.
 area 2 stub
!
line vty
!
