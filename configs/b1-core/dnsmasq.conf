# Branch-1 DHCP server, runs on b1-core.
#
# Each site serves its own users, so a WAN outage does not stop local address
# assignment - the usual design for branch offices.
#
#   VLAN 10 USERS   10.20.10.100 - 10.20.10.150

port=0
no-ping
log-dhcp
log-facility=/var/log/lab-dnsmasq.log
dhcp-leasefile=/var/lib/lab/dnsmasq.leases
dhcp-authoritative

dhcp-range=set:b1-users,10.20.10.100,10.20.10.150,255.255.255.0,12h
dhcp-option=tag:b1-users,option:router,10.20.10.1
