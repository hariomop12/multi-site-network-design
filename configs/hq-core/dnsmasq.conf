# HQ DHCP server, runs on hq-core.
#
# hq-core is the default gateway for every HQ VLAN, so it is directly attached
# to each scope and no relay is needed. Scopes:
#
#   VLAN 10 USERS   10.10.10.100 - 10.10.10.150
#   VLAN 30 VOICE   10.10.30.100 - 10.10.30.120
#
# VLAN 20 (servers) and VLAN 99 (management) are statically addressed, which is
# why there is no pool for them.
#
# DNS is disabled (port=0) - this box is a DHCP server only.
#
# no-ping: dnsmasq normally pings a free address before offering it, ~3s per
# candidate, to avoid handing out an address that is in use by a static device.
# Every address in these pools is DHCP-assigned and the statically addressed
# hosts sit outside the ranges, so the check adds nothing here - and it makes
# the DHCP-exhaustion scenario, which depends on how quickly a scope fills up,
# take several seconds per client instead of being instantaneous.

port=0
no-ping
log-dhcp
log-facility=/var/log/lab-dnsmasq.log
dhcp-leasefile=/var/lib/lab/dnsmasq.leases
dhcp-authoritative

# ---------------------------------------------------------------- VLAN 10
dhcp-range=set:hq-users,10.10.10.100,10.10.10.150,255.255.255.0,12h
dhcp-option=tag:hq-users,option:router,10.10.10.1
dhcp-option=tag:hq-users,option:dns-server,10.10.20.10

# ---------------------------------------------------------------- VLAN 30
# Voice scope. Sized for the four lab phones; the DHCP-exhaustion runbook
# shrinks this range to reproduce a scope running out of addresses.
dhcp-range=set:hq-voice,10.10.30.100,10.10.30.120,255.255.255.0,12h
dhcp-option=tag:hq-voice,option:router,10.10.30.1
