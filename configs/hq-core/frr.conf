frr version 10.7.1
frr defaults traditional
hostname hq-core
!
! ============================================================================
!  HQ edge router / ABR / ASBR
!
!   eth1      WAN -> ISP           203.0.113.2/29     (NAT outside)
!   eth2      trunk -> hq-sw1      none               (router-on-a-stick parent)
!   eth2.10   HQ VLAN 10 USERS     10.10.10.1/24      (area 1, stub)
!   eth2.20   HQ VLAN 20 SERVERS   10.10.20.1/24      (area 1, stub)
!   eth2.30   HQ VLAN 30 VOICE     10.10.30.1/24      (area 1, stub)
!   eth2.99   HQ VLAN 99 MGMT      10.10.99.1/24      (area 1, stub)
!   eth3      WAN -> b1-core       10.0.0.1/30        (area 0)
!   eth4      WAN -> b2-core       10.0.1.1/30        (area 0)
! ============================================================================
!
interface lo
 ip address 1.1.1.1/32
 ip ospf cost 1
!
interface eth1
 description WAN -> ISP (NAT outside)
 ip address 203.0.113.2/29
!
interface eth2
 description trunk -> hq-sw1
!
interface eth2.10
 description HQ VLAN 10 - USERS
 ip address 10.10.10.1/24
 ip ospf cost 100
!
interface eth2.20
 description HQ VLAN 20 - SERVERS
 ip address 10.10.20.1/24
 ip ospf cost 100
!
interface eth2.30
 description HQ VLAN 30 - VOICE
 ip address 10.10.30.1/24
 ip ospf cost 100
!
interface eth2.99
 description HQ VLAN 99 - MGMT
 ip address 10.10.99.1/24
 ip ospf cost 100
!
interface eth3
 description WAN -> b1-core
 ip address 10.0.0.1/30
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 3
 ip ospf dead-interval 10
!
interface eth4
 description WAN -> b2-core
 ip address 10.0.1.1/30
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf hello-interval 3
 ip ospf dead-interval 10
!
router ospf
 ospf router-id 1.1.1.1
 log-adjacency-changes detail
 ! Only the WAN links should form adjacencies; LAN and loopback interfaces
 ! are advertised but must never send hellos.
 passive-interface default
 no passive-interface eth3
 no passive-interface eth4
 !
 network 1.1.1.1/32 area 0
 network 10.0.0.0/30 area 0
 network 10.0.1.0/30 area 0
 network 10.10.10.0/24 area 1
 network 10.10.20.0/24 area 1
 network 10.10.30.0/24 area 1
 network 10.10.99.0/24 area 1
 !
 ! hq-core is the only exit towards the internet, so it originates the
 ! default route for the whole OSPF domain.
 default-information originate
 area 1 stub
!
! The ISP does not peer with us, so the internet path is a static default.
ip route 0.0.0.0/0 203.0.113.1
!
line vty
!
